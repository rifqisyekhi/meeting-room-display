# Nginx: HTTPS (sertifikat internal/self-signed) + reverse proxy untuk Meeting Room Display.
# HTTPS WAJIB untuk fitur rekam di browser (mikrofon diblokir browser di http://<ip>).
#
#   sudo cp deploy/nginx-meeting-room.conf /etc/nginx/sites-available/meeting-room
#   sudo ln -s /etc/nginx/sites-available/meeting-room /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# SESUAIKAN: server_name/IP, path sertifikat, dan path frontend/dist.

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    # Sintaks untuk nginx 1.24 (bawaan Ubuntu 24.04); di nginx >= 1.25.1 boleh diganti "http2 on;".
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/ssl/meeting-room/meeting-room.crt;
    ssl_certificate_key /etc/ssl/meeting-room/meeting-room.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # Frontend hasil `npm run build` (berisi juga /dashboard-app).
    root /srv/meeting-room-display/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API umum
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;
    }

    # API notulen: unggahan audio besar (hingga NOTULEN_MAX_UPLOAD_MB) dan koneksi lama.
    location /api/notulen/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 2100m;
        # Alirkan langsung ke backend (tanpa ditampung dulu di disk nginx).
        proxy_request_buffering off;
        client_body_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    # Service AI (8000) dan Ollama (11434) SENGAJA tidak diproksikan: hanya backend yang memanggilnya.
}
